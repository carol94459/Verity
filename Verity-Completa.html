<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101326"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Verity">
<title>Verity Completa — clareza perante a dúvida</title>
<style>
:root{color-scheme:dark;--bg:#101326;--panel:#191a31;--panel2:#25213c;--line:#39344f;--lav:#c4b5fd;--lav2:#e6deff;--white:#f8f7ff;--muted:#c7c5d5;--soft:#afa9c6;--warn:#f4d49a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101326,#15152b 60%,#101326);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}.logo{height:48px;width:48px;border-radius:16px;background:#282344;display:grid;place-items:center;color:var(--lav);font-size:25px}.brand{font-weight:800;letter-spacing:3px;font-size:20px}.tag{font-size:10px;letter-spacing:1.2px;color:var(--soft);margin-top:4px}h1{font-size:30px;line-height:1.12;margin:8px 0 12px}h2{font-size:23px;margin:8px 0 10px}h3{font-size:16px;margin:0 0 7px}p{line-height:1.5;color:var(--muted);margin:7px 0 14px}.eyebrow{font-size:11px;color:var(--lav);font-weight:700;letter-spacing:1.5px}.hero{border:1px solid var(--line);border-radius:22px;padding:22px;background:radial-gradient(ellipse at 90% 10%,#39305a 0,transparent 45%),linear-gradient(135deg,#191a31,#14162a);margin-bottom:14px}.hero-mark{height:76px;border-radius:16px;background:linear-gradient(135deg,#25213c,#18182d 55%,#3a315a);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--lav);margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.feature{display:block;text-align:left;min-height:130px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;color:var(--white)}.feature:active{border-color:var(--lav)}.feature .emoji{font-size:23px;display:block;margin-bottom:12px}.feature strong{display:block;color:var(--lav2);margin-bottom:5px}.feature small{display:block;color:var(--soft);line-height:1.4}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;background:var(--lav);color:#17142b;font-weight:750;margin:6px 0}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--lav2)}.field{width:100%;background:#111326;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--white);outline:none}.field:focus{border-color:var(--lav)}textarea.field{resize:vertical;min-height:100px;line-height:1.5}.label{display:block;color:var(--lav2);font-size:13px;margin:14px 0 7px}.small{font-size:12px;color:var(--soft)}.pill{display:inline-block;background:#302a4a;color:var(--lav2);border-radius:999px;padding:5px 9px;font-size:11px}.item{background:var(--panel2);border-radius:13px;padding:14px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--lav);font-size:12px;margin-bottom:8px}.icon-btn{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:9px;padding:5px 9px}.result-point{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #48405f}.result-point:last-child{border:0}.result-icon{color:var(--lav);font-size:19px}.result-point strong{display:block;margin-bottom:4px}.notice{border-left:3px solid var(--lav);padding:10px 12px;background:#201d35;color:var(--muted);border-radius:0 10px 10px 0;font-size:12px;line-height:1.5}.warning{border-left-color:var(--warn)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(16,19,38,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav-inner{width:100%;max-width:680px;display:flex;gap:3px}.nav button{flex:1;border:0;background:transparent;color:var(--soft);border-radius:12px;padding:9px 2px;font-size:10px}.nav button span{display:block;font-size:18px;margin-bottom:4px}.nav button.active{background:#302a4a;color:var(--lav2)}.empty{text-align:center;padding:25px 12px;color:var(--soft)}.footer{font-size:11px;color:var(--soft);text-align:center;padding:18px 0}.checkline{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;line-height:1.45;margin:12px 0}.checkline input{margin-top:3px;accent-color:var(--lav)}@media(max-width:420px){.grid{grid-template-columns:1fr}.feature{min-height:0}.nav button{font-size:9px}}@media(min-width:600px){.app{padding-left:24px;padding-right:24px}.nav{padding-left:16px;padding-right:16px}}
</style></head><body><div class="app"><header><div class="logo">◉</div><div><div class="brand">VERITY</div><div class="tag">OBSERVAR · ORGANIZAR · CLARIFICAR</div></div></header><main id="screen"></main><div class="footer">Verity · Ferramenta de clareza, não um detetor de mentiras.</div></div>
<nav class="nav"><div class="nav-inner"><button data-screen="home" class="active"><span>⌂</span>Início</button><button data-screen="analyze"><span>⌕</span>Sinais</button><button data-screen="facts"><span>▤</span>Factos</button><button data-screen="review"><span>◈</span>Avaliar</button><button data-screen="next"><span>➜</span>Próximos passos</button><button data-screen="premium"><span>✦</span>Premium</button></div></nav>
<script>
const $=id=>document.getElementById(id),KEY='verity-complete-items-v1';let screen='home';const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}},write=x=>localStorage.setItem(KEY,JSON.stringify(x)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=d=>new Date(d).toLocaleDateString('pt-PT',{day:'numeric',month:'short',year:'numeric'});function saveItem(type,title,text,extra={}){let a=read();a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,title,text,extra,createdAt:new Date().toISOString()});write(a)}function go(s){screen=s;render();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===s));window.scrollTo(0,0)}function deleteItem(id){if(confirm('Queres eliminar este registo?')){write(read().filter(x=>x.id!==id));render()}}function bindDeletes(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete))}
function home(){let a=read();return `<section class="hero"><div class="eyebrow">CLAREZA PERANTE A DÚVIDA</div><h1>Procura clareza. Não apenas respostas.</h1><p>Organiza o que observaste, distingue factos de interpretações e decide o que precisas de esclarecer.</p><div class="hero-mark">◉</div><button class="btn" id="home-analyze">Começar análise de sinais →</button><div class="notice">A Verity não confirma uma infidelidade nem atribui culpa. Ajuda-te a analisar informação com equilíbrio.</div></section><div class="grid"><button class="feature" data-go="analyze"><span class="emoji">⌕</span><strong>Analisar sinais</strong><small>Explora comportamentos e possíveis explicações.</small></button><button class="feature" data-go="facts"><span class="emoji">▤</span><strong>Organizar factos</strong><small>Regista acontecimentos, datas e o que foi dito.</small></button><button class="feature" data-go="review"><span class="emoji">◈</span><strong>Avaliar a situação</strong><small>Vê o que sabes, o que supões e o que falta esclarecer.</small></button><button class="feature" data-go="next"><span class="emoji">➜</span><strong>Próximos passos</strong><small>Prepara perguntas e escolhas ponderadas.</small></button></div><section class="card"><h3>O teu espaço de trabalho</h3><p>Já tens <strong>${a.length}</strong> registo(s) guardado(s) neste dispositivo.</p><p class="small">Os registos ficam neste navegador. Não existe conta nem cópia de segurança nesta versão.</p><button class="btn secondary" data-go="history">Ver histórico de registos</button></section>`}
function analyze(){return `<div class="eyebrow">01 · SINAIS E CONTEXTO</div><h2>Analisar um comportamento</h2><p>Escolhe o que observaste e descreve o contexto. Um sinal isolado pode ter várias explicações.</p><label class="label" for="signal">Que tipo de situação queres analisar?</label><select id="signal" class="field"><option value="incoerencia">Incoerências entre o que foi dito e feito</option><option value="distancia">Mudança de proximidade ou comunicação</option><option value="segredo">Mais reserva ou privacidade do que antes</option><option value="rotina">Mudanças inesperadas na rotina</option><option value="limites">Limites da relação ou acordos quebrados</option><option value="outro">Outra situação</option></select><label class="label" for="details">O que aconteceu concretamente?</label><textarea id="details" class="field" placeholder="Descreve o que viste ou ouviste, quando aconteceu e o que te levantou dúvidas."></textarea><label class="label" for="frequency">Aconteceu...</label><select id="frequency" class="field"><option value="uma">Uma vez</option><option value="algumas">Algumas vezes</option><option value="recorrente">Repetidamente ao longo do tempo</option><option value="incerto">Não tenho a certeza</option></select><button class="btn" id="run-analysis">Analisar situação</button><div id="analysis-result"></div>`}
function runAnalysis(){let d=$('details').value.trim();if(!d){alert('Descreve primeiro a situação.');return}let type=$('signal').value,freq=$('frequency').value;let names={incoerencia:'Incoerências',distancia:'Mudança de proximidade ou comunicação',segredo:'Reserva ou privacidade',rotina:'Mudança de rotina',limites:'Limites da relação',outro:'Outra situação'},frequency={uma:'Ocorreu uma vez',algumas:'Ocorreu algumas vezes',recorrente:'Descreves um padrão repetido',incerto:'A frequência ainda não está clara'};let focus=type==='incoerencia'?'Compara as afirmações exatas, as datas e o que consegues confirmar diretamente. Uma diferença pode resultar de memória, contexto ou falta de comunicação; procura saber se existe um padrão verificável.':type==='distancia'?'Uma mudança na comunicação pode estar ligada a stress, problemas pessoais, conflitos ou alterações na relação. Observa há quanto tempo acontece e se foi conversada.':type==='segredo'?'A privacidade, por si só, não prova deslealdade. Considera se houve uma quebra concreta de um acordo mútuo e conversa sobre limites e expectativas.':type==='rotina'?'Mudanças de rotina podem ter razões práticas ou pessoais. Distingue o que sabes daquilo que estás a inferir e pergunta sobre o que continua sem explicação.':type==='limites'?'Clarifica qual era o acordo entre vocês, o que aconteceu e o que pode ser confirmado. Uma quebra de acordo merece conversa, mas não permite concluir automaticamente o motivo.':'Regista os factos observáveis, o contexto e o que ainda não sabes. Evita preencher as lacunas com a explicação que mais temes.';$('analysis-result').innerHTML=`<section class="card"><span class="pill">Leitura equilibrada</span><h3 style="margin-top:12px">${esc(names[type])}</h3><div class="result-point"><span class="result-icon">✓</span><div><strong>O que temos</strong><p>${esc(frequency[freq])}. O teu relato é o ponto de partida, não uma prova definitiva.</p></div></div><div class="result-point"><span class="result-icon">◇</span><div><strong>O que considerar</strong><p>${esc(focus)}</p></div></div><div class="result-point"><span class="result-icon">?</span><div><strong>O que falta esclarecer</strong><p>Que parte consegues confirmar diretamente? Há informação em falta? Que explicação alternativa seria razoável verificar?</p></div></div><label class="checkline"><input type="checkbox" id="ack"><span>Compreendo que esta análise organiza possibilidades, não confirma infidelidade.</span></label><button class="btn" id="save-analysis">Guardar análise nos meus registos</button></section>`;$('save-analysis').onclick=()=>{if(!$('ack').checked){alert('Confirma primeiro que compreendes os limites desta análise.');return}saveItem('analysis',names[type],d,{frequency:freq});alert('Análise guardada neste dispositivo.');go('review')}}
function facts(){return `<div class="eyebrow">02 · REGISTO OBJETIVO</div><h2>Organizar factos</h2><p>Regista acontecimentos com palavras simples. Separa o que observaste da interpretação que fizeste.</p><label class="label" for="fact-title">Título curto</label><input id="fact-title" class="field" placeholder="Ex.: conversa de terça-feira"><label class="label" for="fact-date">Data do acontecimento (opcional)</label><input id="fact-date" type="date" class="field"><label class="label" for="fact-kind">Tipo de registo</label><select id="fact-kind" class="field"><option value="observed">Observei diretamente</option><option value="said">Foi-me dito</option><option value="interpretation">A minha interpretação ou dúvida</option><option value="question">Pergunta por esclarecer</option></select><label class="label" for="fact-text">Descrição</label><textarea id="fact-text" class="field" placeholder="O que aconteceu? O que sabes diretamente? O que ainda não sabes?"></textarea><button class="btn" id="save-fact">Guardar registo</button><div id="fact-list"></div>`}
function review(){let a=read(),f=a.filter(x=>x.type==='fact'),an=a.filter(x=>x.type==='analysis');return `<div class="eyebrow">03 · AVALIAR SEM SALTAR A CONCLUSÕES</div><h2>O que sabes até agora?</h2><p>Uma avaliação útil começa por separar evidência, interpretação e dúvidas ainda abertas.</p><section class="card"><h3>O teu registo</h3><div class="result-point"><span class="result-icon">▤</span><div><strong>${f.length} factos ou notas</strong><p>Registos organizados para rever datas, contexto e origem da informação.</p></div></div><div class="result-point"><span class="result-icon">⌕</span><div><strong>${an.length} análises</strong><p>Reflexões sobre comportamentos e possíveis explicações.</p></div></div><button class="btn secondary" id="review-facts">Rever todos os registos</button></section><section class="card"><h3>Lista de verificação</h3><p>Usa estas perguntas antes de tirar conclusões.</p><label class="checkline"><input type="checkbox"><span>Separei aquilo que observei diretamente do que me contaram.</span></label><label class="checkline"><input type="checkbox"><span>Registei datas e contexto sem exagerar nem preencher lacunas.</span></label><label class="checkline"><input type="checkbox"><span>Considerei explicações alternativas plausíveis.</span></label><label class="checkline"><input type="checkbox"><span>Identifiquei o que preciso de perguntar ou confirmar de forma legítima.</span></label><div class="notice warning">Não existe uma pontuação que consiga dizer com fiabilidade se alguém traiu. Mais suspeitas não equivalem automaticamente a prova.</div></section><section class="card"><h3>Qual é a principal dúvida?</h3><textarea id="main-question" class="field" placeholder="Escreve a pergunta que continua sem resposta."></textarea><button class="btn" id="save-question">Guardar dúvida</button></section>`}
function next(){return `<div class="eyebrow">04 · ESCOLHER O PRÓXIMO PASSO</div><h2>O que podes fazer agora?</h2><p>Escolhe uma ação que te ajude a esclarecer a situação sem invadir a privacidade de ninguém nem te colocar em risco.</p><section class="card"><div class="result-point"><span class="result-icon">1</span><div><strong>Preparar uma conversa</strong><p>Usa uma observação concreta e uma pergunta aberta: “Reparei em X e fiquei com dúvidas. Podes ajudar-me a compreender o que aconteceu?”</p></div></div><div class="result-point"><span class="result-icon">2</span><div><strong>Clarificar os acordos</strong><p>Fala sobre exclusividade, honestidade, limites e aquilo de que cada pessoa precisa para voltar a sentir confiança.</p></div></div><div class="result-point"><span class="result-icon">3</span><div><strong>Observar consistência ao longo do tempo</strong><p>Considera se as explicações são claras e se as ações correspondem aos acordos. Evita testes, armadilhas ou vigilância secreta.</p></div></div><div class="result-point"><span class="result-icon">4</span><div><strong>Definir os teus limites</strong><p>Mesmo sem uma prova definitiva, podes decidir o que precisas numa relação e o que farás se a confiança não puder ser reconstruída.</p></div></div></section><section class="card"><h3>Preparar a minha pergunta</h3><label class="label" for="talk-question">O que gostarias de esclarecer?</label><textarea id="talk-question" class="field" placeholder="Escreve uma pergunta clara, direta e respeitosa."></textarea><button class="btn" id="save-talk">Guardar pergunta</button></section><div class="notice warning">Se receias uma reação agressiva ou controladora, dá prioridade à tua segurança e procura apoio de alguém de confiança antes de confrontar a pessoa.</div>`}
function premium(){return `<div class="eyebrow">VERITY COMPLETA</div><h2>Mais clareza, ao teu ritmo.</h2><p>Escolhe o plano que faz sentido para ti. Os preços abaixo são propostas de lançamento e ainda não existe cobrança ativa.</p><section class="card"><span class="pill">GRATUITO</span><h3 style="margin-top:12px">Começar sem pagar</h3><p>Organizar factos, analisar situações e preparar próximos passos.</p><button class="btn secondary" id="premium-free">Continuar com o plano gratuito</button></section><section class="card" style="border-color:var(--lav)"><span class="pill">PREMIUM MENSAL</span><h2 style="margin-top:12px">7,99 € <span class="small">/ mês</span></h2><p>Uma proposta de preço para acesso a funcionalidades Premium futuras.</p><button class="btn" id="premium-month">Escolher plano mensal</button></section><section class="card"><span class="pill">PREMIUM ANUAL</span><h2 style="margin-top:12px">79,90 € <span class="small">/ ano</span></h2><p>Preço anual proposto, equivalente a cerca de 6,66 € por mês.</p><button class="btn" id="premium-year">Escolher plano anual</button></section><div class="notice warning">As subscrições e os pagamentos ainda não estão ativos. Estes botões não cobram dinheiro nem ativam funcionalidades pagas. Antes do lançamento serão necessários pagamentos seguros, gestão de subscrições, termos, política de privacidade e validação do acesso Premium.</div><section class="card"><h3>Disponibilidade internacional</h3><p>O projeto está preparado como protótipo web adaptável a telemóveis. Português, francês, inglês, publicação na App Store e Google Play e disponibilidade por país ainda precisam de implementação e aprovação.</p></section>`}function history(){let a=read();if(!a.length)return `<div class="empty"><div class="hero-mark">◷</div><h2>Ainda não há registos</h2><p>As tuas análises, factos e perguntas guardados aparecerão aqui.</p></div>`;return `<div class="eyebrow">OS TEUS REGISTOS</div><h2>Histórico</h2><p>Os dados são guardados localmente neste navegador.</p>${a.map(x=>`<article class="item"><div class="item-top"><span class="pill">${esc(x.type==='analysis'?'Análise':x.type==='fact'?'Facto / nota':'Pergunta')}</span><span>${dateLabel(x.createdAt)}</span><button class="icon-btn" data-delete="${x.id}">Eliminar</button></div><strong>${esc(x.title||'Registo')}</strong><p>${esc(x.text)}</p></article>`).join('')}`}
function render(){let s=$('screen');if(screen==='home')s.innerHTML=home();else if(screen==='analyze')s.innerHTML=analyze();else if(screen==='facts')s.innerHTML=facts();else if(screen==='review')s.innerHTML=review();else if(screen==='next')s.innerHTML=next();else if(screen==='premium')s.innerHTML=premium();else s.innerHTML=history();s.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if($('home-analyze'))$('home-analyze').onclick=()=>go('analyze');if($('premium-free'))$('premium-free').onclick=()=>go('home');if($('premium-month'))$('premium-month').onclick=()=>alert('Os pagamentos ainda não estão ativos. Não foi efetuada qualquer cobrança.');if($('premium-year'))$('premium-year').onclick=()=>alert('Os pagamentos ainda não estão ativos. Não foi efetuada qualquer cobrança.');if($('run-analysis'))$('run-analysis').onclick=runAnalysis;if($('save-fact'))$('save-fact').onclick=()=>{let t=$('fact-text').value.trim();if(!t){alert('Escreve primeiro a descrição.');return}let title=$('fact-title').value.trim()||'Registo',date=$('fact-date').value;saveItem('fact',title,(date?'Data do acontecimento: '+date+'\n':'')+t,{kind:$('fact-kind').value});alert('Registo guardado.');render()};if($('fact-list')){let a=read().filter(x=>x.type==='fact');$('fact-list').innerHTML=a.length?`<section class="card"><h3>Factos guardados</h3>${a.map(x=>`<article class="item"><div class="item-top"><span>${dateLabel(x.createdAt)}</span><button class="icon-btn" data-delete="${x.id}">Eliminar</button></div><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></article>`).join('')}</section>`:`<div class="empty">Ainda não guardaste factos.</div>`;bindDeletes()}if($('review-facts'))$('review-facts').onclick=()=>go('history');if($('save-question'))$('save-question').onclick=()=>{let v=$('main-question').value.trim();if(!v){alert('Escreve primeiro a tua dúvida.');return}saveItem('question','Dúvida por esclarecer',v);alert('Dúvida guardada.');go('history')};if($('save-talk'))$('save-talk').onclick=()=>{let v=$('talk-question').value.trim();if(!v){alert('Escreve primeiro a pergunta.');return}saveItem('question','Pergunta para uma conversa',v);alert('Pergunta guardada.');go('history')};bindDeletes()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.screen));render();
</script></body></html>
